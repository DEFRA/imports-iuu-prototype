<div class="app-prototype-controls">
  <details class="app-prototype-controls__details">
    <summary class="app-prototype-controls__summary">
      🔧 Prototype Controls
    </summary>
    
    <div class="app-prototype-controls__content">
      <p class="app-prototype-controls__label">Test different styling variations:</p>
      
      {% for key, group in prototypeOptions %}
        <div class="app-prototype-controls__group">
          <h3 class="app-prototype-controls__group-title">{{ group.label }}</h3>
          
          <div class="app-prototype-controls__options">
            {% for option in group.options %}
              <label class="app-prototype-controls__option">
                <input 
                  type="radio" 
                  name="{{ key }}" 
                  value="{{ option.id }}"
                  class="app-prototype-controls__input"
                  data-option-key="{{ key }}"
                  {% if selectedOptions[key] == option.id %}checked{% endif %}
                >
                <span class="app-prototype-controls__option-label">
                  {{ option.label }}
                </span>
                <span class="app-prototype-controls__option-desc">{{ option.description }}</span>
              </label>
            {% endfor %}
          </div>
        </div>
      {% endfor %}
    </div>
  </details>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = Array.from(document.querySelectorAll('.app-prototype-controls__input'))
    for (const input of inputs) {
      input.addEventListener('change', async (e) => {
        const key = e.target.getAttribute('data-option-key')
        const value = e.target.value
        
        await fetch('/part1/v5/prototype-options/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value })
        })
        
        // Reload to apply new styling
        window.location.reload()
      })
    }
  })
</script>
